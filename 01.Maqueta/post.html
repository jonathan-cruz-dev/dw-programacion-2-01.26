<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Social</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="images/social.png" type="image/png">
</head>
<body>
    <header class="bg-success text-white">
        <img src="images/social.png" alt="social" class="icon">
        <h1>Red Social</h1>
    
    </header>

    <main class="container">
        <div class="row mt-4">
            <div class="col-md-2"></div>
            <div class="col-md-8">
                <a href="index.html" class="btn btn-outline-dark"> <i class="fa-solid fa-left-long"></i></a>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-2"></div>

            <div class="col-md-8">
                <form action="" method="post" class="card p-4">
                    <div class="p-2">
                        <label for="titulo">Titulo</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="p-2">
                        <label for="foto">Foto</label>
                        <input type="file" name="foto" class="form-control">
                    </div>

                    <div class="p-2">
                        <label for="descripcion">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-warning">Publicar</button>
                </form>
            </div>
            <div class="col-md-2"></div>

        </div>
    </main>
    <footer class="bg-dark text-white">
        <p> ISEC | PP Programación II | 2026</p>
    </footer>
</body>
</html>
